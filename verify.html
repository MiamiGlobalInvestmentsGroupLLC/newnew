<main id="main">
  <section class="verify-page-section">
    <div class="container">
      <div class="verify-container">

        <!-- Header -->
        <div class="verify-header fade-up">
          <span class="section-label"
                data-en="Official Portal" data-ar="البوابة الرسمية"></span>
          <h1 data-en="Certificate Verification" data-ar="التحقق من الشهادة"></h1>
          <p data-en="Use this portal to confirm the authenticity of any certificate issued by MGI Training Academy. Enter the serial number exactly as printed and the certificate holder's last name."
             data-ar="استخدم هذه البوابة للتحقق من صحة أي شهادة صادرة عن MGI Training Academy. أدخل الرقم التسلسلي كما هو مطبوع واسم عائلة صاحب الشهادة."></p>
        </div>

        <!-- Form Card -->
        <div class="verify-form-card fade-up delay-200">
          <div class="verify-field">
            <label for="serial-input"
                   data-en="Certificate Serial Number" data-ar="الرقم التسلسلي للشهادة"></label>
            <input id="serial-input"
                   placeholder="MGI-2026-000001"
                   aria-label="Certificate serial number"
                   autocomplete="off"
                   spellcheck="false">
          </div>
          <div class="verify-field">
            <label for="last-name-input"
                   data-en="Last Name or Full Name" data-ar="اسم العائلة أو الاسم الكامل"></label>
            <input id="last-name-input"
                   data-en-placeholder="e.g. Al-Rashidi"
                   data-ar-placeholder="مثال: الراشدي"
                   placeholder="Last Name"
                   aria-label="Last name or full name"
                   autocomplete="off">
          </div>
          <button id="verify-btn" class="btn btn-primary verify-submit-btn"
                  data-en="Verify Certificate" data-ar="تحقق من الشهادة"></button>

          <!-- Trust indicators -->
          <div class="verify-trust-row">
            <span class="verify-trust-item">
              <span class="verify-trust-icon">✓</span>
              <span data-en="Secure verification" data-ar="تحقق آمن"></span>
            </span>
            <span class="verify-trust-item">
              <span class="verify-trust-icon">✓</span>
              <span data-en="US-based registry" data-ar="سجل أمريكي"></span>
            </span>
            <span class="verify-trust-item">
              <span class="verify-trust-icon">✓</span>
              <span data-en="Official MGI record" data-ar="سجل MGI الرسمي"></span>
            </span>
          </div>
        </div>

        <!-- Result — populated by verify.js -->
        <div class="verify-result-anim" id="verify-result-wrap" style="display:none;">
          <section id="verify-result" class="card"></section>
        </div>

        <!-- Footer note -->
        <p class="verify-footer-note fade-up delay-300"
           data-en="This verification system is maintained by MGI Training Academy, Miami, Florida. All certificates are individually registered and traceable. For certificate disputes or reissue requests, contact info@miamiglobalgroup.com"
           data-ar="يتم صيانة هذا النظام من قِبل MGI Training Academy، ميامي، فلوريدا. جميع الشهادات مسجلة بشكل فردي وقابلة للتتبع. للنزاعات أو طلبات إعادة الإصدار، تواصل مع info@miamiglobalgroup.com"></p>

      </div>
    </div>
  </section>
</main>

<script>
  // Bridge: verify.js writes to #verify-result; reveal wrapper when result is populated
  (function () {
    var wrapper = document.getElementById('verify-result-wrap');
    var result  = document.getElementById('verify-result');
    if (!wrapper || !result) return;
    var obs = new MutationObserver(function () {
      wrapper.style.display = result.innerHTML.trim() ? 'block' : 'none';
    });
    obs.observe(result, { childList: true, subtree: true });
  })();
</script>
<script src="assets/js/verify.js"></script>
