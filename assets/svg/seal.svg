<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Miami Global Investments Group LLC Training Academy Division official seal">
  <defs>
    <radialGradient id="goldCore" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff8bf"/>
      <stop offset="42%" stop-color="#f1d46f"/>
      <stop offset="72%" stop-color="#d2a63a"/>
      <stop offset="100%" stop-color="#8f6512"/>
    </radialGradient>
    <radialGradient id="goldRing" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#f8e793"/>
      <stop offset="48%" stop-color="#c9932c"/>
      <stop offset="100%" stop-color="#744b0e"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <path id="arcTop" d="M 185 500 A 315 315 0 0 1 815 500"/>
    <path id="arcBottom" d="M 810 500 A 310 310 0 0 1 190 500"/>
  </defs>

  <circle cx="500" cy="500" r="470" fill="url(#goldRing)"/>
  <circle cx="500" cy="500" r="455" fill="none" stroke="#f8e594" stroke-width="8"/>
  <circle cx="500" cy="500" r="438" fill="none" stroke="#7f530d" stroke-width="6"/>
  <circle cx="500" cy="500" r="400" fill="url(#goldCore)"/>
  <circle cx="500" cy="500" r="397" fill="none" stroke="#7f530d" stroke-width="6"/>
  <circle cx="500" cy="500" r="316" fill="none" stroke="#7f530d" stroke-width="7"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#5f3b00" font-weight="700" letter-spacing="2">
    <text font-size="66">
      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">MIAMI GLOBAL INVESTMENTS GROUP LLC</textPath>
    </text>
    <text font-size="66">
      <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">MIAMI • FLORIDA • USA</textPath>
    </text>
  </g>

  <g fill="#5f3b00" font-family="Arial Black, Arial, sans-serif" text-anchor="middle" font-weight="700">
    <text x="500" y="418" font-size="96" letter-spacing="2">TRAINING</text>
    <text x="500" y="510" font-size="96" letter-spacing="2">ACADEMY</text>
    <line x1="270" y1="545" x2="730" y2="545" stroke="#6a4100" stroke-width="4"/>
    <text x="500" y="615" font-size="72">DIVISION</text>
    <line x1="365" y1="635" x2="635" y2="635" stroke="#6a4100" stroke-width="3"/>
    <text x="500" y="706" font-size="64">REG. NO.</text>
  </g>

  <rect x="276" y="730" width="448" height="96" rx="10" fill="none" stroke="#6a4100" stroke-width="4"/>
  <text x="500" y="798" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="74" fill="#5f3b00" letter-spacing="2">L25000313045</text>

  <polygon points="196,520 214,570 266,570 224,603 240,653 196,622 152,653 168,603 126,570 178,570" fill="#5f3b00"/>
  <polygon points="804,520 822,570 874,570 832,603 848,653 804,622 760,653 776,603 734,570 786,570" fill="#5f3b00"/>

  <circle cx="500" cy="500" r="462" fill="none" stroke="#9f700f" stroke-width="24" opacity="0.2"/>
  <rect x="35" y="35" width="930" height="930" fill="none" filter="url(#grain)" opacity="0.55"/>
</svg>
